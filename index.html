<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>空中之島</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="hud" aria-live="polite">
      <strong>空中之島</strong>
      <span>點擊畫面開始｜WASD 移動｜空白鍵跳躍｜按住左鍵挖方塊｜1/2 選方塊｜右鍵放置｜Esc 離開視角控制</span>
      <span id="fps">FPS: --</span>
    </div>
    <div id="inventory" aria-label="方塊欄">
      <span id="dirt-slot">泥土：<strong id="dirt-count">0</strong></span>
      <span id="stone-slot">石頭：<strong id="stone-count">0</strong></span>
    </div>
    <div id="crosshair" aria-hidden="true">+</div>
    <canvas id="game" aria-label="空中之島 3D 遊戲畫面"></canvas>
    <script src="./vendor/three.min.js"></script>
    <script src="./src/step0.js"></script>
    <script src="./src/step1.js"></script>
    <script src="./src/step2.js"></script>
    <script src="./src/step3.js"></script>
    <script src="./src/step4.js"></script>
    <script src="./src/asset-data.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
